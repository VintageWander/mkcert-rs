[package]
name = "mkcert-rs"
version = "0.1.1"
edition = "2021"

[profile.release]
strip = true
panic = "abort"
codegen-units = 1

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
rcgen = { version = "0.14.8", features = ["x509-parser", "crypto"] }
thiserror = { version = "2.0.19" }
rustls-pemfile = { version = "2.2.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
dirs = "6.0.0"
sha1 = "0.11.0"
